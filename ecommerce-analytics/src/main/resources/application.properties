spring.application.name=ecommerce-analytics
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/e_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}

# ==============================
# Security / JWT
# ==============================
jwt.secret=${JWT_SECRET:my-super-secret-key-for-ecommerce-analytics-project-2026}
jwt.expiration-ms=3600000
# ==============================
# NVIDIA NIM + Spring AI
# ==============================

spring.ai.model.chat=openai

# ---------------------------------------------------------------
# PASTE YOUR NVIDIA API KEY DIRECTLY BELOW (replace YOUR_KEY_HERE)
# OR set the NVIDIA_API_KEY environment variable — either works.
# ---------------------------------------------------------------
nvidia.api.key=YOUR_KEY_HERE

spring.ai.openai.api-key=${nvidia.api.key}
spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1

# Explicitly configure the ChatModel connection
spring.ai.openai.chat.api-key=${NVIDIA_API_KEY:${nvidia.api.key}}
spring.ai.openai.chat.base-url=https://integrate.api.nvidia.com/v1
spring.ai.openai.chat.model=nvidia/nemotron-3-ultra-550b-a55b

# NVIDIA requires max-tokens explicitly
spring.ai.openai.chat.max-tokens=2048

# NVIDIA NIM does not provide embeddings through this integration
spring.ai.model.embedding=none

# Temporary debugging for NVIDIA request
logging.level.org.springframework.ai=DEBUG
logging.level.com.openai=DEBUG
logging.level.com.openai.core.http=DEBUG
