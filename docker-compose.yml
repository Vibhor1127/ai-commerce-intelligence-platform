services:
  # ============================================================================
  # MySQL 8.0 Database
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: aci-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e_commerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aci-network

  # ============================================================================
  # Redis 7.0 Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: aci-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aci-network

  # ============================================================================
  # Spring Boot 3 + Java 21 Backend API
  # ============================================================================
  backend:
    build:
      context: ./ecommerce-analytics
      dockerfile: Dockerfile
    container_name: aci-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/e_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-my-super-secret-key-for-ecommerce-analytics-project-2026}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-YOUR_KEY_HERE}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aci-network

  # ============================================================================
  # React + Vite + Nginx Frontend Client
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aci-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - aci-network

# ============================================================================
# Networks & Persistent Volumes
# ============================================================================
networks:
  aci-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
